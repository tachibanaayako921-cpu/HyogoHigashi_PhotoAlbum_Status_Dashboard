<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>写真帳作成進捗ダッシュボード</title>
  <script src="https://aiboard.sateraitoai.jp/script/tailwindcss.js"></script>
  <script src="https://aiboard.sateraitoai.jp/script/chart.js"></script>
  <script src="https://aiboard.sateraitoai.jp/script/chartjs-plugin-datalabels.js"></script>
  <style>
    body { font-family: 'Arial', sans-serif; }
    .tab-btn { transition: all 0.2s; }
    .tab-btn.active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: bold; }
    .progress-bar-container { background-color: #e2e8f0; border-radius: 9999px; }
    .progress-bar-value { height: 100%; border-radius: 9999px; transition: width 0.8s ease-in-out; }
    .status-select { border: 1px solid #d1d5db; border-radius: 6px; padding: 4px 8px; font-size: 13px; cursor: pointer; }
    .status-select.completed { background-color: #d1fae5; color: #065f46; border-color: #6ee7b7; }
    .status-select.incomplete { background-color: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .saving { opacity: 0.6; pointer-events: none; }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; transition: all 0.3s; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: 12px; font-weight: bold; }
    .badge-done { background: #d1fae5; color: #065f46; }
    .badge-undone { background: #fee2e2; color: #991b1b; }
    #page-status { display: none; }
    tr:hover { background-color: #f9fafb; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">📷 写真帳作成進捗ダッシュボード</h1>
        <p class="text-indigo-200 text-sm mt-1" id="last-updated">読み込み中...</p>
      </div>
      <div class="flex gap-3">
        <a href="https://docs.google.com/spreadsheets/d/1Oxs3gGOkSj0O7_HVr_HE0e4PtFSDLCIK7MMB7IYXNHQ/edit?gid=241990694#gid=241990694"
           target="_blank"
           class="bg-white text-indigo-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-50 transition">
          📊 スプレッドシート
        </a>
        <button onclick="loadData()"
                class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
          🔄 更新
        </button>
      </div>
    </div>

    <!-- タブ -->
    <div class="max-w-7xl mx-auto px-6 flex gap-0 border-t border-indigo-600">
      <button class="tab-btn active px-6 py-3 text-white text-sm" id="tab-dashboard" onclick="showPage('dashboard')">
        📊 ダッシュボード
      </button>
      <button class="tab-btn px-6 py-3 text-indigo-200 text-sm" id="tab-status" onclick="showPage('status')">
        ✏️ ステータス管理
      </button>
    </div>
  </header>

  <!-- ダッシュボードページ -->
  <div id="page-dashboard" class="max-w-7xl mx-auto px-6 py-8">

    <!-- KPIカード -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl shadow p-5 flex flex-col items-center fade-in">
        <p class="text-xs text-gray-500 mb-1 uppercase tracking-wide">総写真帳数</p>
        <p class="text-4xl font-extrabold text-blue-600" id="kpi-total">--</p>
        <p class="text-gray-400 text-sm mt-1">冊</p>
      </div>
      <div class="bg-white rounded-xl shadow p-5 flex flex-col items-center fade-in">
        <p class="text-xs text-gray-500 mb-1 uppercase tracking-wide">完了</p>
        <p class="text-4xl font-extrabold text-green-600" id="kpi-completed">--</p>
        <p class="text-gray-400 text-sm mt-1">冊</p>
      </div>
      <div class="bg-white rounded-xl shadow p-5 flex flex-col items-center fade-in">
        <p class="text-xs text-gray-500 mb-1 uppercase tracking-wide">未完了</p>
        <p class="text-4xl font-extrabold text-red-500" id="kpi-incomplete">--</p>
        <p class="text-gray-400 text-sm mt-1">冊</p>
      </div>
      <div class="bg-white rounded-xl shadow p-5 flex flex-col items-center fade-in">
        <p class="text-xs text-gray-500 mb-1 uppercase tracking-wide">完了率</p>
        <p class="text-4xl font-extrabold text-indigo-600" id="kpi-rate">--%</p>
      </div>
    </div>

    <!-- プログレスバー -->
    <div class="bg-white rounded-xl shadow p-5 mb-8 fade-in">
      <div class="flex justify-between text-sm text-gray-500 mb-2">
        <span class="font-semibold text-gray-700">全体進捗</span>
        <span id="progress-label">0%</span>
      </div>
      <div class="w-full h-5 progress-bar-container">
        <div class="progress-bar-value bg-indigo-500" id="progress-bar" style="width:0%"></div>
      </div>
    </div>

    <!-- グラフエリア -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

      <!-- 全体円グラフ -->
      <div class="bg-white rounded-xl shadow p-6 fade-in">
        <h2 class="text-base font-bold text-gray-700 mb-4">全体 完了 / 未完了</h2>
        <div class="flex justify-center" style="height:260px;">
          <canvas id="chart-overall"></canvas>
        </div>
      </div>

      <!-- 施設別棒グラフ -->
      <div class="bg-white rounded-xl shadow p-6 fade-in">
        <h2 class="text-base font-bold text-gray-700 mb-4">施設別 完了率</h2>
        <div style="height:260px;">
          <canvas id="chart-facility"></canvas>
        </div>
      </div>
    </div>

    <!-- 施設別テーブル -->
    <div class="bg-white rounded-xl shadow p-6 fade-in">
      <h2 class="text-base font-bold text-gray-700 mb-4">施設別詳細</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="bg-gray-50 text-gray-500 text-xs uppercase">
              <th class="px-4 py-3 text-left">施設名称</th>
              <th class="px-4 py-3 text-center">総数</th>
              <th class="px-4 py-3 text-center">完了</th>
              <th class="px-4 py-3 text-center">未完了</th>
              <th class="px-4 py-3 text-left w-56">完了率</th>
            </tr>
          </thead>
          <tbody id="facility-table" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ステータス管理ページ -->
  <div id="page-status" class="max-w-7xl mx-auto px-6 py-8">

    <!-- フィルター -->
    <div class="bg-white rounded-xl shadow p-4 mb-6 flex flex-wrap gap-3 items-center fade-in">
      <div>
        <label class="text-xs text-gray-500 block mb-1">施設名称で絞り込み</label>
        <select id="filter-facility" onchange="renderStatusTable()"
                class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="">すべて</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500 block mb-1">ステータスで絞り込み</label>
        <select id="filter-status" onchange="renderStatusTable()"
                class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="">すべて</option>
          <option value="completed">完了のみ</option>
          <option value="incomplete">未完了のみ</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500 block mb-1">機器名称を検索</label>
        <input type="text" id="filter-search" oninput="renderStatusTable()" placeholder="キーワード入力..."
               class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <div class="ml-auto self-end">
        <p class="text-xs text-gray-400">表示件数: <span id="filtered-count">--</span> 件</p>
      </div>
    </div>

    <!-- ステータス一覧テーブル -->
    <div class="bg-white rounded-xl shadow fade-in">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="bg-gray-50 text-gray-500 text-xs uppercase">
              <th class="px-4 py-3 text-left">施設名称</th>
              <th class="px-4 py-3 text-left">機器名称</th>
              <th class="px-4 py-3 text-center">現在のステータス</th>
              <th class="px-4 py-3 text-center">変更</th>
              <th class="px-4 py-3 text-center">保存状態</th>
            </tr>
          </thead>
          <tbody id="status-table" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast hidden">
    <div class="bg-gray-800 text-white px-5 py-3 rounded-xl shadow-lg text-sm flex items-center gap-2">
      <span id="toast-icon">✅</span>
      <span id="toast-msg">保存しました</span>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbySuBUccxRdwj3HNuslT1r6KEHP6Jnnm2n9ozlgAZbAV0oOpx_2OiM2MykwLX7bd0wU/exec';
    const STATUS_OPTIONS = ["完全版", "完成品のみ（完成）", "未作成", "完成品のみ（未完成）"];
    const COMPLETED_STATUSES = ["完全版", "完成品のみ（完成）"];

    let allData = null;
    let chartOverall = null;
    let chartFacility = null;

    // ページ切り替え
    function showPage(page) {
      document.getElementById('page-dashboard').style.display = page === 'dashboard' ? 'block' : 'none';
      document.getElementById('page-status').style.display = page === 'status' ? 'block' : 'none';
      document.getElementById('tab-dashboard').className = 'tab-btn px-6 py-3 text-sm ' + (page === 'dashboard' ? 'active text-white' : 'text-indigo-200');
      document.getElementById('tab-status').className = 'tab-btn px-6 py-3 text-sm ' + (page === 'status' ? 'active text-white' : 'text-indigo-200');
    }

    // データ取得
    async function loadData() {
      document.getElementById('last-updated').textContent = '読み込み中...';
      try {
        const res = await fetch(GAS_URL + '?action=getData');
        const text = await res.text();
        const data = JSON.parse(text);
        if (data.error) throw new Error(data.error);
        allData = data;
        renderDashboard(data);
        renderStatusTable();
        const now = new Date();
        document.getElementById('last-updated').textContent =
          `最終更新: ${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
      } catch (err) {
        showToast('❌', 'データ取得失敗: ' + err.message, true);
        document.getElementById('last-updated').textContent = 'データ取得失敗';
      }
    }

    // ダッシュボード描画
    function renderDashboard(data) {
      const { overall, facilityProgress } = data;
      document.getElementById('kpi-total').textContent = overall.totalSheets;
      document.getElementById('kpi-completed').textContent = overall.completedSheets;
      document.getElementById('kpi-incomplete').textContent = overall.incompleteSheets;
      document.getElementById('kpi-rate').textContent = overall.completionRate.toFixed(1) + '%';
      document.getElementById('progress-bar').style.width = overall.completionRate.toFixed(1) + '%';
      document.getElementById('progress-label').textContent = overall.completionRate.toFixed(1) + '%';

      renderOverallChart(overall);
      renderFacilityChart(facilityProgress);
      renderFacilityTable(facilityProgress);
    }

    // 全体円グラフ
    function renderOverallChart(overall) {
      if (chartOverall) chartOverall.destroy();
      const ctx = document.getElementById('chart-overall').getContext('2d');
      chartOverall = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['完了', '未完了'],
          datasets: [{
            data: [overall.completedSheets, overall.incompleteSheets],
            backgroundColor: ['#10b981', '#f87171'],
            borderWidth: 2,
            borderColor: '#fff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { size: 13 } } },
            datalabels: {
              color: '#fff',
              font: { weight: 'bold', size: 14 },
              formatter: (value, ctx) => {
                const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                return total === 0 ? '' : Math.round(value / total * 100) + '%';
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    // 施設別棒グラフ
    function renderFacilityChart(facilityProgress) {
      if (chartFacility) chartFacility.destroy();
      const ctx = document.getElementById('chart-facility').getContext('2d');
      const labels = facilityProgress.map(f => f.facilityName.length > 10 ? f.facilityName.substring(0, 10) + '…' : f.facilityName);
      const rates = facilityProgress.map(f => parseFloat(f.completionRate.toFixed(1)));
      chartFacility = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '完了率(%)',
            data: rates,
            backgroundColor: rates.map(r => r >= 100 ? '#10b981' : r >= 50 ? '#6366f1' : r >= 20 ? '#f59e0b' : '#f87171'),
            borderRadius: 6,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { min: 0, max: 100, ticks: { callback: v => v + '%' }, grid: { color: '#f3f4f6' } },
            x: { ticks: { font: { size: 10 } } }
          },
          plugins: {
            legend: { display: false },
            datalabels: {
              anchor: 'end', align: 'top',
              color: '#374151',
              font: { size: 11, weight: 'bold' },
              formatter: v => v + '%'
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    // 施設別テーブル
    function renderFacilityTable(facilityProgress) {
      const tbody = document.getElementById('facility-table');
      tbody.innerHTML = '';
      facilityProgress.forEach(item => {
        const r = item.completionRate;
        let barColor = r >= 100 ? 'bg-green-500' : r >= 50 ? 'bg-indigo-500' : r >= 20 ? 'bg-amber-400' : 'bg-red-400';
        let rateColor = r >= 100 ? 'text-green-600' : r >= 50 ? 'text-indigo-600' : r >= 20 ? 'text-amber-600' : 'text-red-600';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="px-4 py-3 font-medium text-gray-800">${item.facilityName}</td>
          <td class="px-4 py-3 text-center text-gray-500">${item.totalItems}</td>
          <td class="px-4 py-3 text-center font-semibold text-green-600">${item.completedItems}</td>
          <td class="px-4 py-3 text-center font-semibold text-red-500">${item.incompleteItems}</td>
          <td class="px-4 py-3">
            <div class="flex items-center gap-2">
              <div class="flex-1 h-2 bg-gray-200 rounded-full">
                <div class="h-2 rounded-full ${barColor}" style="width:${r.toFixed(1)}%"></div>
              </div>
              <span class="font-bold ${rateColor} w-12 text-right text-xs">${r.toFixed(1)}%</span>
            </div>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    // ステータス管理テーブル描画
    function renderStatusTable() {
      if (!allData) return;

      const filterFacility = document.getElementById('filter-facility').value;
      const filterStatus = document.getElementById('filter-status').value;
      const filterSearch = document.getElementById('filter-search').value.toLowerCase();

      // 施設フィルタの選択肢を動的生成
      const facilitySelect = document.getElementById('filter-facility');
      const currentVal = facilitySelect.value;
      const facilities = [...new Set(allData.items.map(i => i.facilityName))];
      facilitySelect.innerHTML = '<option value="">すべて</option>';
      facilities.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f; opt.textContent = f;
        if (f === currentVal) opt.selected = true;
        facilitySelect.appendChild(opt);
      });

      const filtered = allData.items.filter(item => {
        if (filterFacility && item.facilityName !== filterFacility) return false;
        if (filterStatus === 'completed' && !item.isCompleted) return false;
        if (filterStatus === 'incomplete' && item.isCompleted) return false;
        if (filterSearch && !item.equipmentName.toLowerCase().includes(filterSearch)) return false;
        return true;
      });

      document.getElementById('filtered-count').textContent = filtered.length;

      const tbody = document.getElementById('status-table');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">該当するデータがありません</td></tr>';
        return;
      }

      filtered.forEach(item => {
        const isCompleted = COMPLETED_STATUSES.includes(item.status);
        const badgeClass = isCompleted ? 'badge-done' : 'badge-undone';
        const badgeText = isCompleted ? '✅ 完了' : '⏳ 未完了';

        const tr = document.createElement('tr');
        tr.id = `row-${item.rowIndex}`;
        tr.innerHTML = `
          <td class="px-4 py-3 text-sm text-gray-700 whitespace-nowrap">${item.facilityName}</td>
          <td class="px-4 py-3 text-sm text-gray-800">${item.equipmentName}</td>
          <td class="px-4 py-3 text-center">
            <span class="badge ${badgeClass}" id="badge-${item.rowIndex}">${badgeText}</span>
          </td>
          <td class="px-4 py-3 text-center">
            <select class="status-select ${isCompleted ? 'completed' : 'incomplete'}"
                    id="select-${item.rowIndex}"
                    onchange="handleStatusChange(${item.rowIndex}, this)">
              ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === item.status ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
          <td class="px-4 py-3 text-center text-xs text-gray-400" id="save-state-${item.rowIndex}">−</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ステータス変更ハンドラ
    async function handleStatusChange(rowIndex, selectEl) {
      const newStatus = selectEl.value;
      const isCompleted = COMPLETED_STATUSES.includes(newStatus);

      // UI即時更新
      selectEl.className = 'status-select ' + (isCompleted ? 'completed' : 'incomplete');
      const badge = document.getElementById(`badge-${rowIndex}`);
      badge.className = 'badge ' + (isCompleted ? 'badge-done' : 'badge-undone');
      badge.textContent = isCompleted ? '✅ 完了' : '⏳ 未完了';
      const saveState = document.getElementById(`save-state-${rowIndex}`);
      saveState.textContent = '保存中...';
      saveState.className = 'text-xs text-amber-500';
      selectEl.disabled = true;

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateStatus', rowIndex: rowIndex, newStatus: newStatus })
        });
        const result = await res.json();
        if (result.error) throw new Error(result.error);

        // allDataを更新
        const target = allData.items.find(i => i.rowIndex === rowIndex);
        if (target) {
          target.status = newStatus;
          target.isCompleted = isCompleted;
        }

        saveState.textContent = '✅ 保存済み';
        saveState.className = 'text-xs text-green-600 font-semibold';
        showToast('✅', `「${newStatus}」に更新しました`);

        // ダッシュボードデータを再集計
        recalcDashboard();

      } catch (err) {
        saveState.textContent = '❌ 失敗';
        saveState.className = 'text-xs text-red-600 font-semibold';
        showToast('❌', '保存失敗: ' + err.message, true);
      } finally {
        selectEl.disabled = false;
      }
    }

    // ダッシュボードをローカルで再集計（GAS再取得なし）
    function recalcDashboard() {
      if (!allData) return;
      let total = 0, completed = 0, incomplete = 0;
      const facilityMap = {};
      allData.items.forEach(item => {
        total++;
        const f = item.facilityName;
        if (!facilityMap[f]) facilityMap[f] = { facilityName: f, totalItems: 0, completedItems: 0, incompleteItems: 0, completionRate: 0 };
        facilityMap[f].totalItems++;
        if (item.isCompleted) { completed++; facilityMap[f].completedItems++; }
        else { incomplete++; facilityMap[f].incompleteItems++; }
      });
      const rate = total === 0 ? 0 : (completed / total) * 100;
      for (const k in facilityMap) {
        const p = facilityMap[k];
        p.completionRate = p.totalItems === 0 ? 0 : (p.completedItems / p.totalItems) * 100;
      }
      allData.overall = { totalSheets: total, completedSheets: completed, incompleteSheets: incomplete, completionRate: rate };
      allData.facilityProgress = Object.values(facilityMap);
      renderDashboard(allData);
    }

    // トースト表示
    function showToast(icon, msg, isError = false) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-icon').textContent = icon;
      document.getElementById('toast-msg').textContent = msg;
      toast.querySelector('div').className = `px-5 py-3 rounded-xl shadow-lg text-sm flex items-center gap-2 ${isError ? 'bg-red-700' : 'bg-gray-800'} text-white`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      showPage('dashboard');
      loadData();
    });
  </script>
</body>
</html>
