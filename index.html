<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写真帳作成進捗状況ダッシュボード</title>
    <script src="https://aiboard.sateraitoai.jp/script/tailwindcss.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .progress-bar-container { background-color: #e2e8f0; border-radius: 9999px; }
        .progress-bar-value { height: 100%; border-radius: 9999px; transition: width 0.8s ease-in-out; }
        .loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    </style>
</head>
<body class="bg-gray-100 p-6">

    <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">写真帳作成進捗状況ダッシュボード</h1>
    <p class="text-center text-sm text-gray-400 mb-8" id="last-updated">データを読み込み中...</p>

    <!-- 全体進捗 -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">全体進捗</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="card p-4 rounded-lg flex flex-col justify-center items-center bg-blue-50">
                <p class="text-sm text-gray-500 mb-1">総写真帳数</p>
                <p class="text-5xl font-bold text-blue-600" id="total-sheets">
                    <span class="loading">--</span>
                </p>
                <p class="text-sm text-gray-400 mt-1">冊</p>
            </div>
            <div class="card p-4 rounded-lg flex flex-col justify-center items-center bg-green-50">
                <p class="text-sm text-gray-500 mb-1">完了</p>
                <p class="text-5xl font-bold text-green-600" id="completed-sheets">
                    <span class="loading">--</span>
                </p>
                <p class="text-sm text-gray-400 mt-1">冊</p>
            </div>
            <div class="card p-4 rounded-lg flex flex-col justify-center items-center bg-red-50">
                <p class="text-sm text-gray-500 mb-1">未完了</p>
                <p class="text-5xl font-bold text-red-600" id="incomplete-sheets">
                    <span class="loading">--</span>
                </p>
                <p class="text-sm text-gray-400 mt-1">冊</p>
            </div>
            <div class="card p-4 rounded-lg flex flex-col justify-center items-center bg-indigo-50">
                <p class="text-sm text-gray-500 mb-1">完了率</p>
                <p class="text-5xl font-bold text-indigo-600" id="completion-rate">
                    <span class="loading">--%</span>
                </p>
            </div>
        </div>
        <!-- 全体プログレスバー -->
        <div class="mt-6">
            <div class="flex justify-between text-sm text-gray-500 mb-1">
                <span>進捗状況</span>
                <span id="progress-label">0%</span>
            </div>
            <div class="w-full h-5 progress-bar-container">
                <div class="progress-bar-value bg-indigo-500" id="completion-progress" style="width:0%"></div>
            </div>
        </div>
    </div>

    <!-- 項目の完了状況 -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">施設別完了状況</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">施設名称</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">総数</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">完了</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">未完了</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-48">完了率</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="facility-table-body">
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-gray-400 loading">データを読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- フッター -->
    <div class="text-center text-sm text-gray-500 mt-4 mb-8 space-y-2">
        <p>このダッシュボードはGoogleスプレッドシートと同期しています</p>
        <div class="flex justify-center gap-4">
            <a href="https://docs.google.com/spreadsheets/d/1Oxs3gGOkSj0O7_HVr_HE0e4PtFSDLCIK7MMB7IYXNHQ/edit?gid=241990694#gid=241990694"
               class="inline-block bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition"
               target="_blank">📊 スプレッドシートを開く</a>
            <button onclick="updateDashboardData()"
                    class="inline-block bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition">
                🔄 データを更新する
            </button>
        </div>
    </div>

    <script>
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySuBUccxRdwj3HNuslT1r6KEHP6Jnnm2n9ozlgAZbAV0oOpx_2OiM2MykwLX7bd0wU/exec';

        async function updateDashboardData() {
            // ローディング表示
            document.getElementById('last-updated').textContent = 'データを読み込み中...';
            document.getElementById('facility-table-body').innerHTML =
                '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-400">データを読み込み中...</td></tr>';

            try {
                const response = await fetch(GOOGLE_APPS_SCRIPT_URL);
                const text = await response.text();

                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseError) {
                    throw new Error('JSONパースエラー: ' + text.substring(0, 200));
                }

                if (data.error) {
                    throw new Error('GASエラー: ' + data.error);
                }

                // 全体進捗の更新
                const total = data.overall.totalSheets;
                const completed = data.overall.completedSheets;
                const incomplete = data.overall.incompleteSheets;
                const rate = data.overall.completionRate;

                document.getElementById('total-sheets').textContent = total + ' 冊';
                document.getElementById('completed-sheets').textContent = completed + ' 冊';
                document.getElementById('incomplete-sheets').textContent = incomplete + ' 冊';
                document.getElementById('completion-rate').textContent = rate.toFixed(1) + '%';
                document.getElementById('completion-progress').style.width = rate.toFixed(1) + '%';
                document.getElementById('progress-label').textContent = rate.toFixed(1) + '%';

                // 最終更新時刻
                const now = new Date();
                document.getElementById('last-updated').textContent =
                    `最終更新: ${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

                // 施設別テーブルの更新
                const tableBody = document.getElementById('facility-table-body');
                tableBody.innerHTML = '';

                if (!data.facilityProgress || data.facilityProgress.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-400">データがありません</td></tr>';
                    return;
                }

                data.facilityProgress.forEach(item => {
                    const r = item.completionRate;
                    let barColor = 'bg-red-400';
                    let rateColor = 'text-red-600';
                    if (r >= 100) { barColor = 'bg-green-500'; rateColor = 'text-green-600'; }
                    else if (r >= 50) { barColor = 'bg-blue-400'; rateColor = 'text-blue-600'; }
                    else if (r >= 20) { barColor = 'bg-orange-400'; rateColor = 'text-orange-600'; }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="px-6 py-4 text-sm font-medium text-gray-900">${item.facilityName}</td>
                        <td class="px-6 py-4 text-sm text-gray-500 text-center">${item.totalItems}</td>
                        <td class="px-6 py-4 text-sm font-semibold text-green-600 text-center">${item.completedItems}</td>
                        <td class="px-6 py-4 text-sm font-semibold text-red-600 text-center">${item.incompleteItems}</td>
                        <td class="px-6 py-4 text-sm">
                            <div class="flex items-center gap-2">
                                <div class="flex-1 h-2 bg-gray-200 rounded-full">
                                    <div class="h-2 rounded-full ${barColor}" style="width:${r.toFixed(1)}%"></div>
                                </div>
                                <span class="font-semibold ${rateColor} w-12 text-right">${r.toFixed(1)}%</span>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (error) {
                console.error('エラー:', error);
                document.getElementById('total-sheets').textContent = 'エラー';
                document.getElementById('completed-sheets').textContent = 'エラー';
                document.getElementById('incomplete-sheets').textContent = 'エラー';
                document.getElementById('completion-rate').textContent = 'エラー';
                document.getElementById('last-updated').textContent = 'データの取得に失敗しました';
                document.getElementById('facility-table-body').innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center text-red-600 font-semibold">
                            ❌ ${error.message}<br>
                            <span class="text-sm font-normal text-gray-500">
                                GASのシート名・列番号を確認後、再デプロイしてください
                            </span>
                        </td>
                    </tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDashboardData();
        });
    </script>
</body>
</html>
