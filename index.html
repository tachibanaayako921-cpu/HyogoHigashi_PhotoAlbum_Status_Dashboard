<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写真帳作成進捗状況ダッシュボード</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .progress-bar-container {
            background-color: #e2e8f0;
            border-radius: 9999px;
        }
        .progress-bar-value {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 p-6">

    <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">写真帳作成進捗状況ダッシュボード</h1>

    <!-- 全体進捗 -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">全体進捗</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card p-4 rounded-lg flex flex-col justify-center">
                <p class="text-lg text-gray-600">総写真帳数</p>
                <p class="text-4xl font-bold text-blue-600 mt-2" id="total-sheets">--</p>
            </div>
            <div class="card p-4 rounded-lg flex flex-col justify-center">
                <p class="text-lg text-gray-600">完了写真帳数</p>
                <p class="text-4xl font-bold text-green-600 mt-2" id="completed-sheets">--</p>
            </div>
            <div class="card p-4 rounded-lg flex flex-col justify-center">
                <p class="text-lg text-gray-600">未完了写真帳数</p>
                <p class="text-4xl font-bold text-red-600 mt-2" id="incomplete-sheets">--</p>
            </div>
            <div class="card p-4 rounded-lg flex flex-col justify-center">
                <p class="text-lg text-gray-600">完了率</p>
                <div class="flex items-center mt-2">
                    <p class="text-4xl font-bold text-indigo-600 mr-4" id="completion-rate">--%</p>
                    <div class="w-full h-3 progress-bar-container">
                        <div class="progress-bar-value bg-indigo-500" id="completion-progress" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 項目の完了状況 -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">項目の完了状況</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">施設名称</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">項目の総数</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">完了数</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">未完了数</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">完了率</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="facility-table-body">
                    <!-- ここにデータが動的に挿入されます -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="text-center text-sm text-gray-500 mt-8">
        <p>このダッシュボードはGitHubで公開され、Googleスプレッドシートと同期しています。</p>
        <p><a href="https://docs.google.com/spreadsheets/d/1Oxs3gGOkSj0O7_HVr_HE0e4PtFSDLCIK7MMB7IYXNHQ/edit?gid=241990694#gid=241990694" class="text-blue-500 hover:underline" target="_blank">Googleスプレッドシートで詳細を確認</a></p>
    </div>

    <script>
        // Google Apps ScriptのウェブアプリURL
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySuBUccxRdwj3HNuslT1r6KEHP6Jnnm2n9ozlgAZbAV0oOpx_2OiM2MykwLX7bd0wU/exec';

        // スプレッドシートからデータを取得してダッシュボードを更新する関数
        async function updateDashboardData() {
            try {
                const response = await fetch(GOOGLE_APPS_SCRIPT_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                // 全体進捗の更新
                document.getElementById('total-sheets').textContent = data.overall.totalSheets;
                document.getElementById('completed-sheets').textContent = data.overall.completedSheets;
                document.getElementById('incomplete-sheets').textContent = data.overall.incompleteSheets;
                const completionRate = data.overall.completionRate;
                document.getElementById('completion-rate').textContent = completionRate.toFixed(1) + '%';
                document.getElementById('completion-progress').style.width = completionRate.toFixed(1) + '%';

                // 項目の完了状況の更新
                const tableBody = document.getElementById('facility-table-body');
                tableBody.innerHTML = ''; // 既存の行をクリア

                data.facilityProgress.forEach(item => {
                    const row = tableBody.insertRow();
                    // 完了率に基づいて色分けするクラスを追加
                    let completionRateColorClass = 'text-red-600'; // デフォルトは赤
                    if (item.completionRate > 50) {
                        completionRateColorClass = 'text-green-600';
                    } else if (item.completionRate > 20) {
                        completionRateColorClass = 'text-orange-600';
                    }

                    let completedItemsColorClass = 'text-green-600';
                    if (item.completedItems === 0) {
                        completedItemsColorClass = 'text-red-600';
                    }


                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.facilityName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.totalItems}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm ${completedItemsColorClass} font-semibold">${item.completedItems}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-red-600 font-semibold">${item.incompleteItems}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${completionRateColorClass}">${item.completionRate.toFixed(1)}%</td>
                    `;
                });

            } catch (error) {
                console.error('ダッシュボードデータの取得または更新に失敗しました:', error);
                // エラー発生時の表示
                document.getElementById('total-sheets').textContent = 'エラー';
                document.getElementById('completed-sheets').textContent = 'エラー';
                document.getElementById('incomplete-sheets').textContent = 'エラー';
                document.getElementById('completion-rate').textContent = 'エラー';
                document.getElementById('completion-progress').style.width = '0%';
                document.getElementById('facility-table-body').innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center text-red-600 font-semibold">データの取得に失敗しました。しばらくしてから再度お試しください。</td>
                    </tr>
                `;
            }
        }

        // DOMContentLoadedイベントでデータ更新関数を呼び出す
        document.addEventListener('DOMContentLoaded', () => {
            updateDashboardData(); // ページ読み込み時にデータを更新
            // 必要に応じて、定期的な自動更新を設定
            // setInterval(updateDashboardData, 60000); // 例: 1分ごとに更新
        });
    </script>
</body>
</html>
